<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Forma — 让想法，有了形状。</title>
  <desc id="desc">米白色画布上的 Forma 标识，以及从描述想法、构建应用到继续打磨的三层卡片。产品概念示意。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f3"/><stop offset="1" stop-color="#eeede5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8dfcc"/><stop offset="1" stop-color="#b9c7ac"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#353b2b" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1440" height="640" rx="24" fill="url(#paper)"/>
  <g fill="none" stroke="#dcded2" opacity=".5">
    <circle cx="1090" cy="320" r="242"/><circle cx="1090" cy="320" r="290"/>
    <path d="M690 0v640M0 556h1440"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#252a24">
    <g transform="translate(76 63)">
      <rect width="26" height="18" rx="4" transform="rotate(-14 13 9)"/>
      <rect x="3" y="23" width="17" height="15" rx="3" fill="#8b9480" transform="rotate(-14 11 30)"/>
      <text x="44" y="29" font-size="39" font-weight="650" letter-spacing="-2">forma.</text>
    </g>
    <text x="78" y="180" font-size="12" letter-spacing="4" fill="#72796b">FROM A THOUGHT TO A THING</text>
    <text x="73" y="269" font-size="62" font-family="'Noto Serif SC', 'Songti SC', STSong, serif">让想法，</text>
    <text x="73" y="349" font-size="72" font-family="'Noto Serif SC', 'Songti SC', STSong, serif">有了形状。</text>
    <path d="M78 370c118 8 263 1 364-10" stroke="#9da78f" stroke-width="1.5" fill="none"/>
    <text x="78" y="421" font-size="18" fill="#646b5e">用自然语言构建应用，在同一个空间持续打磨。</text>
    <g transform="translate(78 465)" font-size="12" letter-spacing="1.5" fill="#707868">
      <text>DESCRIBE</text><path d="M90-4h36m-5-4 5 4-5 4" stroke="#9aa38d" fill="none"/>
      <text x="145">BUILD</text><path d="M204-4h36m-5-4 5 4-5 4" stroke="#9aa38d" fill="none"/>
      <text x="259">REFINE</text>
    </g>
    <g transform="translate(782 89) rotate(-7 240 100)" filter="url(#shadow)">
      <rect width="465" height="148" rx="16" fill="#e5e9dc" stroke="#d6ddcd"/>
      <text x="27" y="35" font-size="11" letter-spacing="2" fill="#717d62">01 / DESCRIBE</text>
      <text x="27" y="79" font-size="20">做一个属于自己的阅读收藏夹。</text>
      <text x="27" y="112" font-size="13" fill="#7c8671">从一句描述开始。</text>
    </g>
    <g transform="translate(808 200) rotate(3 240 125)" filter="url(#shadow)">
      <rect width="480" height="243" rx="16" fill="#fffefa" stroke="#e0e2d8"/>
      <path d="M0 43h480" stroke="#e9eade"/>
      <g fill="#d5d9cd"><circle cx="23" cy="23" r="3"/><circle cx="35" cy="23" r="3"/><circle cx="47" cy="23" r="3"/></g>
      <text x="451" y="27" text-anchor="end" font-size="10" letter-spacing="2" fill="#8a9280">02 / BUILD</text>
      <text x="27" y="86" font-size="13" fill="#66765b">◒ 慢读</text>
      <text x="27" y="128" font-size="28" font-family="'Noto Serif SC', 'Songti SC', STSong, serif">好内容，值得慢慢读。</text>
      <rect x="27" y="153" width="133" height="62" rx="7" fill="url(#accent)"/>
      <rect x="173" y="153" width="133" height="62" rx="7" fill="#e6ded2"/>
      <rect x="319" y="153" width="133" height="62" rx="7" fill="#d9e0d4"/>
      <g stroke="#fffefa" stroke-width="3" opacity=".8"><path d="M40 174h65m-65 11h90M186 174h65m-65 11h90M332 174h65m-65 11h90"/></g>
    </g>
    <g transform="translate(882 453) rotate(-3 200 42)" filter="url(#shadow)">
      <rect width="418" height="85" rx="13" fill="#303b2d"/>
      <text x="23" y="27" font-size="10" letter-spacing="2" fill="#abb99f">03 / REFINE</text>
      <text x="23" y="56" font-size="17" fill="#f5f5ed">加上阅读状态，让收藏不止于收藏。</text>
      <path d="M377 57V39m-6 6 6-6 6 6" stroke="#d5dfc8" stroke-width="1.5" fill="none"/>
    </g>
    <text x="78" y="600" font-size="11" letter-spacing="2" fill="#828a79">A WORKSPACE FOR IDEAS IN PROGRESS.</text>
    <text x="1362" y="600" text-anchor="end" font-size="11" letter-spacing="2" fill="#828a79">FORMA / APPLICATION WORKSPACE</text>
  </g>
</svg>
